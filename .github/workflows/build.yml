import 'dart:async';
import 'dart:math';
import 'package:flutter/material.dart';

void main() => runApp(const SparkMinerPro());

class SparkMinerPro extends StatelessWidget {
  const SparkMinerPro({super.key});
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'SPARK MINER PRO',
      theme: ThemeData.dark().copyWith(
        scaffoldBackgroundColor: const Color(0xFF0A0E14),
        colorScheme: const ColorScheme.dark(primary: Color(0xFFFFD700)),
      ),
      home: const ProHome(),
    );
  }
}

class ProHome extends StatefulWidget {
  const ProHome({super.key});
  @override
  State<ProHome> createState() => _ProHomeState();
}

class _ProHomeState extends State<ProHome> {
  int _tab = 0;
  double balance = 1247.85;
  double hash = 2450;
  bool mining = true;
  Timer? timer;
  final rand = Random();

  @override
  void initState() {
    super.initState();
    timer = Timer.periodic(const Duration(seconds: 1), (_) {
      if (mining) setState(() => balance += 0.0023);
    });
  }

  @override
  void dispose() { timer?.cancel(); super.dispose(); }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: IndexedStack(
        index: _tab,
        children: [buildMine(), buildSpin(), buildRefer(), buildWallet()],
      ),
      bottomNavigationBar: BottomNavigationBar(
        backgroundColor: const Color(0xFF11161F),
        selectedItemColor: const Color(0xFFFFD700),
        unselectedItemColor: Colors.white54,
        currentIndex: _tab,
        type: BottomNavigationBarType.fixed,
        onTap: (i) => setState(() => _tab = i),
        items: const [
          BottomNavigationBarItem(icon: Icon(Icons.bolt), label: 'MINING'),
          BottomNavigationBarItem(icon: Icon(Icons.casino), label: 'SPIN'),
          BottomNavigationBarItem(icon: Icon(Icons.group), label: 'REFER'),
          BottomNavigationBarItem(icon: Icon(Icons.account_balance_wallet), label: 'WALLET'),
        ],
      ),
    );
  }

  Widget buildMine() {
    return SafeArea(
      child: ListView(
        padding: const EdgeInsets.all(20),
        children: [
          Row(children: [
            Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4), decoration: BoxDecoration(color: Colors.amber, borderRadius: BorderRadius.circular(20)), child: const Text('VIP PRO', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold))),
            const Spacer(),
            const Icon(Icons.verified, color: Color(0xFFFFD700))
          ]),
          const SizedBox(height: 20),
          Container(
            padding: const EdgeInsets.all(20),
            decoration: BoxDecoration(gradient: const LinearGradient(colors: [Color(0xFFFFD700), Color(0xFFFF8C00)]), borderRadius: BorderRadius.circular(20)),
            child: Column(children: [
              const Text('TOTAL BSC BALANCE', style: TextStyle(color: Colors.black54, fontWeight: FontWeight.bold)),
              const SizedBox(height: 8),
              Text('${balance.toStringAsFixed(4)} BSC', style: const TextStyle(color: Colors.black, fontSize: 32, fontWeight: FontWeight.w900)),
              Text('\$${(balance*650).toStringAsFixed(2)}', style: const TextStyle(color: Colors.black87, fontSize: 16)),
            ]),
          ),
          const SizedBox(height: 20),
          Row(children: [
            box('HASHRATE', '${hash.toStringAsFixed(0)} MH/s', Icons.speed),
            const SizedBox(width: 12),
            box('MINERS', '12 ACTIVE', Icons.memory),
          ]),
          const SizedBox(height: 20),
          Container(
            height: 180,
            decoration: BoxDecoration(color: const Color(0xFF11161F), borderRadius: BorderRadius.circular(20), border: Border.all(color: const Color(0xFFFFD700).withOpacity(0.3))),
            child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
              Icon(Icons.bolt, size: 60, color: mining ? const Color(0xFFFFD700) : Colors.grey),
              const SizedBox(height: 10),
              Text(mining ? 'MINING IS ACTIVE' : 'MINING STOPPED', style: TextStyle(color: mining ? const Color(0xFFFFD700) : Colors.grey, fontWeight: FontWeight.bold, letterSpacing: 2)),
              const SizedBox(height: 15),
              ElevatedButton(
                style: ElevatedButton.styleFrom(backgroundColor: mining ? Colors.redAccent : const Color(0xFFFFD700), foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(horizontal: 30, vertical: 12)),
                onPressed: () => setState(() => mining = !mining),
                child: Text(mining ? 'STOP MINING' : 'START MINING', style: const TextStyle(fontWeight: FontWeight.bold)),
              )
            ]),
          ),
        ],
      ),
    );
  }

  Widget buildSpin() {
    return SafeArea(
      child: Center(
        child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
          const Text('DAILY SPIN & WIN', style: TextStyle(color: Color(0xFFFFD700), fontSize: 24, fontWeight: FontWeight.bold)),
          const SizedBox(height: 20),
          Container(width: 180, height: 180, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: const Color(0xFFFFD700), width: 4), gradient: const SweepGradient(colors: [Colors.amber, Colors.orange, Colors.amberAccent, Colors.amber])), child: const Icon(Icons.casino, size: 80, color: Colors.black)),
          const SizedBox(height: 30),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700), foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(horizontal: 40, vertical: 15)),
            onPressed: () {
              double win = (rand.nextDouble() * 2);
              setState(() => balance += win);
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('YOU WON ${win.toStringAsFixed(3)} BSC!'), backgroundColor: Colors.amber, behavior: SnackBarBehavior.floating));
            },
            child: const Text('SPIN NOW - FREE', style: TextStyle(fontWeight: FontWeight.w900)),
          ),
          const SizedBox(height: 10),
          const Text('3 Spins left today', style: TextStyle(color: Colors.white54)),
        ]),
      ),
    );
  }

  Widget buildRefer() {
    return SafeArea(
      child: ListView(padding: const EdgeInsets.all(20), children: [
        const Text('REFER & EARN 10%', style: TextStyle(color: Color(0xFFFFD700), fontSize: 22, fontWeight: FontWeight.bold)),
        const SizedBox(height: 15),
        Container(padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: const Color(0xFF11161F), borderRadius: BorderRadius.circular(12)), child: Row(children: [const Expanded(child: Text('https://spark.pro/ref/77XPRO', style: TextStyle(color: Colors.white70))), IconButton(onPressed: () {}, icon: const Icon(Icons.copy, color: Color(0xFFFFD700)))])),
        const SizedBox(height: 15),
        box('TOTAL REFERRALS', '128 Users', Icons.group),
        const SizedBox(height: 10),
        box('REFERRAL EARNINGS', '45.2 BSC', Icons.card_giftcard),
      ]),
    );
  }

  Widget buildWallet() {
    return SafeArea(
      child: ListView(padding: const EdgeInsets.all(20), children: [
        const Text('WALLET & WITHDRAW', style: TextStyle(color: Color(0xFFFFD700), fontSize: 22, fontWeight: FontWeight.bold)),
        const SizedBox(height: 20),
        TextField(decoration: InputDecoration(hintText: 'Enter BEP20 USDT Address', filled: true, fillColor: const Color(0xFF11161F), border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)))),
        const SizedBox(height: 20),
        ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700), foregroundColor: Colors.black, minimumSize: const Size(double.infinity, 55)), onPressed: () { ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Withdraw Request Sent! 24h me ayega'))); }, child: const Text('WITHDRAW USDT', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16))),
        const SizedBox(height: 20),
        const Text('Minimum Withdraw: 10 BSC\nFees: 2%\nNetwork: BSC BEP20', style: TextStyle(color: Colors.white54)),
      ]),
    );
  }

  Widget box(String t, String v, IconData ic) {
    return Expanded(child: Container(padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: const Color(0xFF11161F), borderRadius: BorderRadius.circular(16)), child: Column(children: [Icon(ic, color: const Color(0xFFFFD700)), const SizedBox(height: 8), Text(t, style: const TextStyle(color: Colors.white54, fontSize: 10)), Text(v, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold))])));
  }
}
