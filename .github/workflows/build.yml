name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup project
        run: |
          if [! -d "android" ]; then
            flutter create. --project-name bsc_mine_hub --org com.spark.miner
          fi
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: SPARK-Miner-PRO-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
