workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Update Ads Library
        script: |
          # Purana google_mobile_ads update karo
          flutter pub add google_mobile_ads:^5.1.0 || true
          # pubspec.yaml me version force update
          sed -i '' 's/google_mobile_ads:.*/google_mobile_ads: ^5.1.0/g' pubspec.yaml || sed -i 's/google_mobile_ads:.*/google_mobile_ads: ^5.1.0/g' pubspec.yaml
          flutter clean
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
