workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
    scripts:
      - name: Fix deps and Build APK
        script: |
          flutter pub upgrade
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
