workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix Android v1 Embedding
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
      - name: Make Easy Link
        script: |
          APK=$(find . -name "app-release.apk" | head -1)
          curl --upload-file $APK https://transfer.sh/BSC.apk | tee link.txt
    artifacts:
      - build/**/outputs/**/*.apk
      - link.txt
