workflows:
  android-workflow:
    name: android-workflow
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Build APK with Ad
        script: |
          rm -rf android
          flutter create --platforms=android .
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:url_launcher/url_launcher.dart';
          void main() => runApp(BscApp());
          class BscApp extends StatefulWidget { @override State<BscApp> createState() => _BscAppState(); }
          class _BscAppState extends State<BscApp> {
            double balance = 0.0;
            Future<void> watchAd() async {
              final url = Uri.parse('https://www.effectivecpmnetwork.com/vm70uh6qxb?key=30472d3647946c4a2a73f4ef7660c55f');
              if (await canLaunchUrl(url)) { await launchUrl(url, mode: LaunchMode.externalApplication); }
              setState(() { balance += 0.00010; });
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('+ \$0.00010 Added')));
            }
            @override Widget build(BuildContext context) {
              return MaterialApp(home: Scaffold(
                backgroundColor: Color(0xFF0B0E14),
                appBar: AppBar(title: Text('BSC Mine Hub - Earn'), backgroundColor: Colors.orange),
                body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  Text('Balance', style: TextStyle(color: Colors.white70)),
                  Text('\$${balance.toStringAsFixed(5)}', style: TextStyle(color: Colors.orange, fontSize: 40, fontWeight: FontWeight.bold)),
                  SizedBox(height: 20),
                  ElevatedButton(onPressed: watchAd, style: ElevatedButton.styleFrom(backgroundColor: Colors.orange, padding: EdgeInsets.symmetric(horizontal: 40, vertical: 15)),
                  child: Text('WATCH AD +0.00010', style: TextStyle(fontSize: 18))),
                  SizedBox(height: 10),
                  Text('Click karne par aapki Ad khulegi', style: TextStyle(color: Colors.white54))
                ])),
              ));
            }
          }
          EOF
          flutter pub add url_launcher
          flutter clean
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
