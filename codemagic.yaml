workflows:
  android-workflow:
    name: android-workflow
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: SIMULATOR BUILD FIVERR SAFE
        script: |
          flutter create --platforms=android --org com.mining.simulator . --overwrite
          cat > pubspec.yaml << 'YAML'
          name: mining_simulator
          version: 6.0.0+1
          publish_to: none
          environment:
            sdk: ">=3.2.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            url_launcher: ^6.2.5
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:async';import 'dart:math';import 'package:flutter/material.dart';import 'package:url_launcher/url_launcher.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,theme:ThemeData.dark().copyWith(scaffoldBackgroundColor:Color(0xFF0B0E11)),home:Sim()));
          class Sim extends StatefulWidget{@override State<Sim> createState()=>_S();}
          class _S extends State<Sim> with TickerProviderStateMixin{
          double coins=5407.3;bool mining=true;late AnimationController ac;final ad='https://www.effectivecpmnetwork.com/vm70uh6qxb?key=30472d3647946c4a2a73f4ef7660c55f';
          @override void initState(){super.initState();ac=AnimationController(vsync:this,duration:Duration(milliseconds:800))..repeat(reverse:true);Timer.periodic(Duration(milliseconds:90),(t){if(mining&&mounted)setState(()=>coins+=0.24);});}
          Future<void> watchAd(double r)async{await launchUrl(Uri.parse(ad),mode:LaunchMode.externalApplication);if(mounted)setState(()=>coins+=r*1000);}
          @override Widget build(c){double hs=10+Random().nextDouble()*6;return Scaffold(appBar:AppBar(backgroundColor:Color(0xFF0B0E11),title:Text('MINING SIMULATOR',style:TextStyle(fontWeight:FontWeight.w900)),actions:[Chip(label:Text('SIMULATOR GAME'),backgroundColor:Color(0xFFFCD535).withOpacity(0.2))]),body:ListView(padding:EdgeInsets.all(16),children:[ScaleTransition(scale:Tween(begin:0.98,end:1.03).animate(CurvedAnimation(parent:ac,curve:Curves.easeInOut)),child:Container(padding:EdgeInsets.all(22),decoration:BoxDecoration(color:Color(0xFF1E2329),borderRadius:BorderRadius.circular(26),border:Border.all(color:Color(0xFFFCD535).withOpacity(0.25))),child:Column(children:[Text('SIMULATED POWER ${hs.toStringAsFixed(2)} GH/s',style:TextStyle(color:Color(0xFFFCD535),fontWeight:FontWeight.bold)),SizedBox(height:14),Text('${coins.toStringAsFixed(1)} COINS',style:TextStyle(fontSize:38,fontWeight:FontWeight.w900)),Text('For Fun - No Real Money',style:TextStyle(color:Colors.white38,fontSize:11)),SizedBox(height:18),Row(children:[Expanded(child:OutlinedButton(onPressed:()=>setState(()=>mining=!mining),child:Text(mining?'PAUSE':'RESUME'))),SizedBox(width:12),Expanded(flex:2,child:ElevatedButton(style:ElevatedButton.styleFrom(backgroundColor:Color(0xFFFCD535),foregroundColor:Colors.black),onPressed:()=>watchAd(0.25),child:Text('WATCH AD +500')))] )]))),SizedBox(height:14),Row(children:[_bx(Icons.casino,'LUCKY SPIN','Watch Ad to Spin',Colors.purple,()=>watchAd(0.8)),SizedBox(width:12),_bx(Icons.store,'GAME SHOP','Redeem Coins',Colors.green,(){showModalBottomSheet(context:context,backgroundColor:Color(0xFF181A20),shape:RoundedRectangleBorder(borderRadius:BorderRadius.vertical(top:Radius.circular(20))),builder:(_)=>Padding(padding:EdgeInsets.all(20),child:Column(mainAxisSize:MainAxisSize.min,children:[Text('Game Shop (Simulator)',style:TextStyle(fontWeight:FontWeight.w900,fontSize:18)),ListTile(title:Text('Buy Skin 5000 Coins'),onTap:(){if(coins>=5000)setState(()=>coins-=5000);Navigator.pop(context);}),ListTile(title:Text('Double Speed 2000 Coins'),onTap:(){if(coins>=2000)setState(()=>coins-=2000);Navigator.pop(context);})])));})])],),bottomNavigationBar:Padding(padding:EdgeInsets.all(12),child:Text('This is a mining simulator game for entertainment. No real crypto mining or real money withdrawal.',textAlign:TextAlign.center,style:TextStyle(color:Colors.white30,fontSize:10)))));}
          Widget _bx(IconData i,String t,String s,Color c,VoidCallback o)=>Expanded(child:InkWell(onTap:o,child:Container(height:110,padding:EdgeInsets.all(16),decoration:BoxDecoration(color:Color(0xFF1E2329),borderRadius:BorderRadius.circular(18)),child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Icon(i,color:c),Spacer(),Text(t,style:TextStyle(fontWeight:FontWeight.w900)),Text(s,style:TextStyle(fontSize:11,color:Colors.white54))]))));
          }
          DART
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
