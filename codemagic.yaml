workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
      - name: Upload to Permanent Link
        script: |
          APK=$(find build -name "app-release.apk" | head -1)
          echo "APK found: $APK"
          echo "Uploading to Catbox (permanent link)..."
          curl -F reqtype=fileupload -F fileToUpload=@$APK https://catbox.moe/user/api.php || true
          echo ""
          echo "--- DONE --- Copy link above"
    artifacts:
      - build/**/outputs/**/*.apk
