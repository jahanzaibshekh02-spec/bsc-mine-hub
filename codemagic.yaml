workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Regenerate Android folder
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub get
      - name: Build App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
