workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix Old Project
        script: |
          rm -rf android
          flutter create --platforms=android --project-name bsc_mine_hub .
          if [ -f "lib/firebase_options.dart" ]; then
            echo "Firebase project detected"
          fi
      - name: Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
