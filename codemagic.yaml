workflows:
  android-workflow:
    name: Build APK
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build Clean V1
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
