workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release
      - name: Upload to GoFile
        script: |
          APK=$(find build -name "app-release.apk" | head -1)
          curl -F file=@$APK https://upload.gofile.io/upload
    artifacts:
      - build/**/outputs/**/*.apk
