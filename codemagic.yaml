workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.5
    scripts:
      - name: Fix deps and Create Android
        script: |
          flutter pub upgrade
          flutter create --platforms=android .
      - name: Build AAB
        script: |
          flutter build appbundle --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.aab
