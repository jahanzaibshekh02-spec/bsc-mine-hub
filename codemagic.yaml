workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
      - name: Upload
        script: |
          APK=$(find . -name app-release.apk | head -1)
          curl -F reqtype=fileupload -F fileToUpload=@$APK https://catbox.moe/user/api.php
    artifacts:
      - build/**/outputs/**/*.apk
