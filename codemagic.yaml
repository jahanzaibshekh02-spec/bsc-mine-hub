workflows:
  android-workflow:
    name: SIMULATOR BUILD FIVERR SAFE
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      - name: Clean Project
        script: |
          flutter clean
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release --no-tree-shake-icons --verbose
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your-email@gmail.com
