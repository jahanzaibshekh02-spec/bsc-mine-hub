workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
      - name: Upload to Permanent Link
        script: |
          APK=$(find build -name "app-release.apk" | head -1)
          echo "Uploading..."
          curl -F "file=@$APK" https://tmpfiles.org/api/v1/upload
          echo ""
          echo "Second backup link..."
          curl --upload-file $APK https://transfer.sh/app-release.apk
    artifacts:
      - build/**/outputs/**/*.apk
