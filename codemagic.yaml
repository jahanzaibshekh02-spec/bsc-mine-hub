workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Recreate Android project
        script: |
          rm -rf android
          flutter create --platforms=android .
      - name: Add AdMob ID safely
        script: |
          python3 << 'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f: data = f.read()
          admob_id = "ca-app-pub-9184265616231271~4098381853"
          if "APPLICATION_ID" not in data:
            data = re.sub(r"(<application[^>]*>)", r"\1\n        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\""+admob_id+"\"/>", data, count=1)
          open(path, "w", encoding="utf-8").write(data)
          print("OK")
          PY
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release
      - name: Upload to GoFile
        script: |
          APK=$(find build -name "app-release.apk" | head -1)
          curl -F file=@$APK https://upload.gofile.io/upload
    artifacts:
      - build/**/outputs/**/*.apk
