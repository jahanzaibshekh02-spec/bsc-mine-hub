workflows:
  android-workflow:
    name: android-workflow
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: PRO MAX BUILD FREE PLAN
