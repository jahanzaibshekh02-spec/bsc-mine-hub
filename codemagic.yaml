workflows:
  android-workflow:
    name: Build APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix V1 Embedding Forever
        script: |
          rm -rf android
          flutter create --platforms=android --project-name bsc_mine_hub .
          # Ads ko abhi band rakho taake build ho jaye
          sed -i.bak 's/.*google_mobile_ads/# removed/g' pubspec.yaml || true
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
