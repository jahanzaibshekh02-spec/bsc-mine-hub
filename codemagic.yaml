workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
      - name: Make Easy Link
        script: |
          APK=$(find . -name "app-release.apk" | head -1)
          curl --upload-file $APK https://transfer.sh/BSC.apk | tee link.txt
          echo "LINK READY"
    artifacts:
      - build/**/outputs/**/*.apk
      - link.txt
