workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Fix and Build
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub add google_mobile_ads url_launcher
          python3 << 'PY'
          import pathlib
          p=pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t=p.read_text()
          if "APPLICATION_ID" not in t:
              adm="ca-app-pub-9184265616231271~4098381853"
              t=t.replace("<application", f'<queries><package android:name="com.whatsapp" /></queries>\n    <application', 1)
              idx=t.find("<application>") 
              if idx==-1: idx=t.find("<application")
              e=t.find(">",idx)
              meta=f'\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{adm}"/>'
              t=t[:e+1]+meta+t[e+1:]
              p.write_text(t)
          PY
          cat > lib/main.dart << 'DART'
          import 'dart:async'; import 'package:flutter/material.dart'; import 'package:google_mobile_ads/google_mobile_ads.dart'; import 'package:url_launcher/url_launcher.dart';
         
