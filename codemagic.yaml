workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
      - name: Create Super Fast Link
        script: |
          APK_PATH=$(find build -name "*.apk" | head -1)
          echo "Uploading..."
          curl --upload-file $APK_PATH https://transfer.sh/BSC-Mine-Hub.apk > link.txt
          echo "====== YOUR DOWNLOAD LINK ======"
          cat link.txt
          echo "================================"
    artifacts:
      - build/**/outputs/**/*.apk
      - link.txt
