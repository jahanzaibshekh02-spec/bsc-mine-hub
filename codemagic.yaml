workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Recreate and Inject Reward
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub add google_mobile_ads
          python3 << 'PY'
          path="android/app/src/main/AndroidManifest.xml"
          txt=open(path).read()
          if "APPLICATION_ID" not in txt:
            admob="ca-app-pub-9184265616231271~4098381853"
            s=txt.find("<application"); e=txt.find(">",s)
            txt=txt[:e+1]+'\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'+admob+'"/>' + txt[e+1:]
            open(path,"w").write(txt)
          PY
          cat > lib/main.dart << 'DART'
          import 'dart:async'; import 'package:flutter/material.dart'; import 'package:google_mobile_ads/google_mobile_ads.dart';
          void main(){WidgetsFlutterBinding.ensureInitialized(); MobileAds.instance.initialize(); runApp(BSCApp());}
          class BSCApp extends StatefulWidget{@override State<BSCApp> createState()=>_BSCAppState();}
          class _BSCAppState extends State<BSCApp>{
            double balance=0.00011; bool isMining=true; Timer? timer; BannerAd? bannerAd; RewardedAd? rewardedAd;
            double minWithdraw=0.01000; TextEditingController walletCtrl=TextEditingController();
            final String rewardedId='ca-app-pub-9184265616231271/7370879625';
            @override void initState(){super.initState(); BannerAd(adUnitId:'ca-app-pub-3940256099942544/6300978111',size:AdSize.banner,request:AdRequest(),listener:BannerAdListener(onAdLoaded:(ad){setState(()=>bannerAd=ad as BannerAd);}))..load(); loadRewarded(); startMining();}
            void loadRewarded(){RewardedAd.load(adUnitId:rewardedId,request:AdRequest(),rewardedAdLoadCallback:RewardedAdLoadCallback(onAdLoaded:(ad){rewardedAd=ad;},onAdFailedToLoad:(e){}));}
            void startMining(){timer=Timer.periodic(Duration(seconds:2),(t){if(isMining)setState(()=>balance+=0.00001);});}
            void claimCoin(){if(rewardedAd!=null){rewardedAd!.show(onUserEarnedReward:(a,r){setState(()=>balance+=0.00010); ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('1 Coin Added!')));}); rewardedAd!.fullScreenContentCallback=FullScreenContentCallback(onAdDismissedFullScreenContent:(ad){ad.dispose(); loadRewarded();});}else{ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('Ad loading...'))); loadRewarded();}}
            void showWithdraw(){showDialog(context:context,builder:(c)=>AlertDialog(title:Text('Withdraw BSC'),content:Column(mainAxisSize:MainAxisSize.min,children:[Text('Balance: ${balance.toStringAsFixed(5)} BSC\nMin: $minWithdraw'),SizedBox(height:10),TextField(controller:walletCtrl,decoration:InputDecoration(hintText:'BEP20 Address',border:OutlineInputBorder()))]),actions:[TextButton(onPressed:()=>Navigator.pop
