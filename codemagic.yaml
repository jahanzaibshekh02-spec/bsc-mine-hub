workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
    scripts:
      - name: Create Android
        script: |
          flutter create --platforms=android .
      - name: Build Debug AAB for testing
        script: |
          flutter build appbundle --debug
    artifacts:
      - build/**/outputs/**/*.aab
