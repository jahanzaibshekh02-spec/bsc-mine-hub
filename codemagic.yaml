workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix and Build
        script: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
      - name: Upload to Permanent Link
        script: |
          APK=$(find . -name "app-release.apk" | head -1)
          echo "Uploading $APK"
          curl -F "file=@$APK" https://0x0.st
    artifacts:
      - build/**/outputs/**/*.apk
